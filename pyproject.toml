[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-aware-solver"
version = "0.1.0"
description = "OCR-Aware Question Solving Agent with Visual Refinement and Synthetic Noise Injection"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Senior AI Engineer" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "pillow>=10.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
ocr-solver = "ocr_solver.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
